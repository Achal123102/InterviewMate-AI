<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}InterviewMate AI{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}"><span>MI</span> InterviewMate AI</a>
  <nav><a href="{{ url_for('index') }}">Dashboard</a><a href="{{ url_for('history') }}">History</a></nav>
</header>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer>InterviewMate AI · Smart Mock interview practice</footer>
<script src="{{ url_for('static', filename='script.js') }}"></script>
{% block scripts %}{% endblock %}

<!-- InterviewMate AI Chatbot -->
<button id="chatbot-toggle" class="chatbot-toggle" type="button">
  🤖 Chat with InterviewMate
</button>

<div id="chatbot-panel" class="chatbot-panel hidden">
  <div class="chatbot-header">
    <div>
      <strong>🤖 InterviewMate AI</strong>
      <small>Your interview assistant</small>
    </div>
    <button id="chatbot-close" type="button" aria-label="Close chatbot">×</button>
  </div>

  <div id="chatbot-messages" class="chatbot-messages">
    <div class="bot-message">
      Hi! Ask me about resumes, mock interviews, MCQs or interview tips.
    </div>
  </div>

  <form id="chatbot-form">
    <input id="chatbot-input" type="text"
           placeholder="Type your message..." required>
    <button type="submit">Send</button>
  </form>
</div>
<script src="/static/chatbot.js" defer></script>
</body></html>
